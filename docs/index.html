<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inkora — a painting studio for Android</title>
<meta name="description" content="Inkora is a free drawing and painting app for Android tablets and the S Pen. Download the APK. English, العربية, کوردی.">
<meta property="og:title" content="Inkora — a painting studio for Android">
<meta property="og:description" content="Free drawing app for Android tablets: pressure brushes, layers, perspective grids, vector shapes and a color wheel under your pen.">
<meta name="theme-color" content="#141a3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700;800&family=Noto+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Inkora — "the page is a canvas".
   Ground: ultramarine ink. The only full-spectrum color on the page is the hue ring, exactly like in the app.
   Marigold is the action color (download), coral marks things you can touch and try. */
:root {
  --night: #141a3a;
  --night-2: #1c2350;
  --night-3: #262e63;
  --line: rgba(232, 230, 255, .12);
  --paper: #f6f3ff;
  --mute: #aab0d6;
  --marigold: #ffc14d;
  --coral: #ff6b8b;
  --dot: rgba(232, 230, 255, .09);
  --f-display: "Unbounded", "Noto Kufi Arabic", system-ui, sans-serif;
  --f-body: "Figtree", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
:root[dir="rtl"] {
  --f-display: "Noto Kufi Arabic", "Unbounded", system-ui, sans-serif;
  --f-body: "Noto Sans Arabic", "Figtree", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--night); color: var(--paper);
  font: 400 1.0625rem/1.6 var(--f-body);
  overflow-x: hidden;
}
:root[dir="rtl"] body { line-height: 1.85; }
img, svg, canvas { display: block; max-width: 100%; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--marigold); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; font-weight: 700; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }

/* ---------- header ---------- */
.top {
  position: fixed; inset: 0 0 auto; z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--night) 78%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.top .wrap { display: flex; align-items: center; gap: 22px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 800 1.15rem var(--f-display); font-family: "Unbounded", sans-serif; letter-spacing: -.01em; }
.brand svg { width: 30px; height: 30px; }
.top nav { display: flex; gap: 22px; margin-inline-start: auto; }
.top nav a { text-decoration: none; color: var(--mute); font-size: .95rem; }
.top nav a:hover { color: var(--paper); }
.langs { display: flex; background: var(--night-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.langs button {
  border: 0; background: none; color: var(--mute); cursor: pointer; border-radius: 999px;
  padding: 6px 12px; font: 500 .88rem "Figtree", "Noto Sans Arabic", sans-serif;
}
.langs button[aria-pressed="true"] { background: var(--paper); color: var(--night); }
.top .get { padding: 9px 16px; font-size: .92rem; }
@media (max-width: 900px) { .top nav { display: none; } .langs { margin-inline-start: auto; } }
@media (max-width: 560px) { .top .get { display: none; } .brand span { display: none; } }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 10px; text-decoration: none; cursor: pointer;
  border-radius: 999px; border: 1px solid transparent; font: 600 1rem var(--f-body);
  padding: 14px 24px; transition: transform .15s ease, background .15s ease;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-main { background: var(--marigold); color: #2a1b00; }
.btn-main:hover { background: #ffd27a; }
.btn-main:active { transform: scale(.97); }
.btn-ghost { border-color: var(--line); color: var(--paper); background: rgba(255,255,255,.03); }
.btn-ghost:hover { border-color: var(--mute); }

/* ---------- hero: a canvas you can draw on ---------- */
.hero {
  position: relative; min-height: max(640px, 100svh);
  background-color: var(--night);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size: 28px 28px;
  overflow: hidden; touch-action: none;
}
#ink { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.hero-copy {
  position: relative; z-index: 2; pointer-events: none;
  padding-top: calc(64px + env(safe-area-inset-top, 0px) + clamp(48px, 10vh, 120px));
  padding-bottom: 150px;
  display: grid; gap: 26px; max-width: 760px;
}
.hero-copy .btn, .hero-copy a { pointer-events: auto; }
.hero h1 {
  font-size: clamp(2.6rem, 7.2vw, 6rem); line-height: .98; letter-spacing: -.035em; font-weight: 800;
}
:root[dir="rtl"] .hero h1 { letter-spacing: 0; line-height: 1.25; font-size: clamp(2.3rem, 6.4vw, 5rem); }
.lead { font-size: clamp(1.08rem, 1.6vw, 1.25rem); color: var(--mute); max-width: 56ch; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; list-style: none; margin: 0; padding: 0; }
.facts li { border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: .86rem; color: var(--mute); background: rgba(20,26,58,.6); }
.ink-tools {
  position: absolute; z-index: 3; inset-inline-end: max(20px, env(safe-area-inset-right, 0px)); bottom: 24px;
  display: flex; align-items: center; gap: 10px;
  background: rgba(20,26,58,.82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 6px 6px 16px;
}
:root[dir="rtl"] .ink-tools { padding: 6px 16px 6px 6px; }
.ink-tools .hint { font-size: .88rem; color: var(--mute); }
.ink-tools button {
  border: 1px solid var(--line); background: var(--night-2); color: var(--paper); cursor: pointer;
  border-radius: 999px; padding: 7px 14px; font: 500 .88rem var(--f-body);
}
.swatch-now { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--paper); flex: none; }
@media (max-width: 640px) { .ink-tools .hint { display: none; } .hero-copy { padding-bottom: 200px; } }

/* ---------- sections ---------- */
section.band { padding-block: clamp(80px, 12vw, 150px); position: relative; }
.band + .band { border-top: 1px solid var(--line); }
.head { display: grid; gap: 16px; margin-bottom: clamp(36px, 5vw, 60px); max-width: 760px; }
.head h2 { font-size: clamp(1.9rem, 4.2vw, 3.3rem); line-height: 1.05; letter-spacing: -.025em; }
:root[dir="rtl"] .head h2 { letter-spacing: 0; line-height: 1.35; }
.head p { color: var(--mute); font-size: 1.12rem; max-width: 60ch; }

/* ---------- the new layout (tablet mockup) ---------- */
.tour { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(28px, 4vw, 56px); align-items: center; }
@media (max-width: 960px) { .tour { grid-template-columns: 1fr; } }
.tablet {
  container-type: inline-size; position: relative; aspect-ratio: 16 / 10.4;
  border-radius: 4.2cqw; background: #05070f; padding: 1.9cqw;
  box-shadow: 0 40px 80px -30px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
}
.screen {
  position: relative; width: 100%; height: 100%; border-radius: 2.4cqw; overflow: hidden;
  background: #2b2b30; direction: ltr; font-family: "Figtree", sans-serif;
}
.paper-art { position: absolute; left: 9%; right: 9%; top: 12.5%; bottom: 5%; background: #fbf8f2; box-shadow: 0 1cqw 3cqw rgba(0,0,0,.35); }
.paper-art svg { width: 100%; height: 100%; }
.m-bar { position: absolute; inset: 0 0 auto; height: 7.6%; background: #131316; display: flex; align-items: center; padding: 0 1.4cqw; gap: .9cqw; color: #f2f2f5; font-size: 1.25cqw; }
.m-bar svg { width: 2.2cqw; height: 2.2cqw; }
.m-tab { display: flex; align-items: center; gap: .5cqw; padding: .4cqw .8cqw; border-radius: .8cqw; }
.m-tab.on { background: rgba(76,141,255,.2); }
.m-title { flex: 1; text-align: center; color: #9b9ba5; }
.m-group { display: flex; gap: .6cqw; background: #1e1e23; border-radius: 1cqw; padding: .4cqw .7cqw; }
.m-group .on { color: #4c8dff; }
.m-color { width: 2.6cqw; height: 2.6cqw; border-radius: 50%; background: #e0457b; border: .25cqw solid #fff; }
.m-side, .m-dock {
  position: absolute; top: 50%; translate: 0 -46%; background: rgba(19,19,22,.95); border-radius: 1.4cqw;
  display: flex; flex-direction: column; align-items: center; gap: .9cqw; padding: 1cqw .6cqw; color: #f2f2f5;
}
.m-side { left: 1.2cqw; height: 66%; }
.m-dock { right: 1.2cqw; }
.m-dock svg, .m-side svg { width: 2.2cqw; height: 2.2cqw; }
.m-dock .on { color: #4c8dff; background: rgba(76,141,255,.2); border-radius: .7cqw; padding: .3cqw; box-sizing: content-box; }
.m-slider { width: .6cqw; flex: 1; border-radius: 1cqw; background: rgba(255,255,255,.3); position: relative; }
.m-slider::after { content: ""; position: absolute; left: 50%; translate: -50% 0; width: 2cqw; height: 1.4cqw; border-radius: .5cqw; background: #f2f2f5; top: var(--t, 40%); }
.m-menu { position: absolute; left: 47%; top: 52%; width: 36cqw; aspect-ratio: 1; translate: -50% -50%; }
.m-menu canvas { width: 100%; height: 100%; }
.pin {
  position: absolute; z-index: 2; width: 3cqw; height: 3cqw; min-width: 22px; min-height: 22px; border-radius: 50%;
  background: var(--coral); color: #2a0010; display: grid; place-items: center;
  font: 700 max(1.4cqw, 11px) "Figtree", sans-serif; box-shadow: 0 0 0 .5cqw rgba(255,107,139,.25);
}
.callouts { list-style: none; margin: 0; padding: 0; display: grid; gap: 26px; }
.callouts li { display: grid; grid-template-columns: 30px 1fr; gap: 14px; }
.callouts .pin { position: static; width: 28px; height: 28px; font-size: 13px; box-shadow: none; }
.callouts h3 { font-size: 1.06rem; margin-bottom: 4px; letter-spacing: -.01em; }
:root[dir="rtl"] .callouts h3 { letter-spacing: 0; }
.callouts p { color: var(--mute); font-size: .98rem; }

/* ---------- pen menu playground ---------- */
.pen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
@media (max-width: 960px) { .pen { grid-template-columns: 1fr; } }
.qm-wrap { position: relative; max-width: 520px; width: 100%; margin-inline: auto; aspect-ratio: 1; touch-action: none; }
#qm { width: 100%; height: 100%; cursor: pointer; }
.qm-tip {
  position: absolute; top: 0; left: 50%; translate: -50% 0; background: #101013; color: #fff;
  border-radius: 999px; padding: 5px 14px; font-size: .9rem; pointer-events: none; opacity: 0; transition: opacity .12s;
  white-space: nowrap; direction: ltr;
}
.gestures { list-style: none; margin: 30px 0 0; padding: 0; display: grid; gap: 0; border-top: 1px solid var(--line); }
.gestures li { display: grid; grid-template-columns: minmax(130px, .9fr) 1.6fr; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.gestures b { font-weight: 600; }
.gestures span { color: var(--mute); }
.tryline { margin-top: 22px; color: var(--coral); font-size: .98rem; }

/* ---------- build your toolbar ---------- */
.builder { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(24px, 5vw, 64px); align-items: start; }
@media (max-width: 720px) { .builder { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--night-2); color: var(--paper);
  border-radius: 14px; padding: 10px 16px 10px 12px; font: 500 .98rem var(--f-body);
  transition: background .15s, border-color .15s;
}
:root[dir="rtl"] .chip { padding: 10px 12px 10px 16px; }
.chip svg { width: 22px; height: 22px; }
.chip[aria-pressed="true"] { background: rgba(76,141,255,.16); border-color: #4c8dff; }
.chip[aria-pressed="true"] svg { color: #7fb0ff; }
.dock-demo {
  justify-self: center; width: 86px; min-height: 420px; background: #131316; border-radius: 22px;
  border: 1px solid rgba(255,255,255,.08); padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
  box-shadow: 0 30px 60px -30px rgba(0,0,0,.8);
}
.dock-demo .slot { width: 56px; height: 56px; display: grid; place-items: center; border-radius: 14px; color: #f2f2f5; animation: pop .22s ease; }
.dock-demo .slot svg { width: 28px; height: 28px; }
.dock-demo .empty { color: var(--mute); font-size: .8rem; text-align: center; padding: 18px 8px; }
.dock-demo .count { margin-top: auto; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.1); width: 60%; text-align: center; color: var(--mute); font-size: .8rem; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- features ---------- */
.ledger { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 clamp(28px, 5vw, 80px); }
@media (max-width: 760px) { .ledger { grid-template-columns: 1fr; } }
.ledger section { padding-block: 26px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 54px 1fr; gap: 18px; }
.ledger .glyph { width: 54px; height: 54px; border-radius: 16px; background: var(--night-2); display: grid; place-items: center; color: var(--marigold); }
.ledger .glyph svg { width: 28px; height: 28px; }
.ledger h3 { font-size: 1.3rem; margin-bottom: 10px; letter-spacing: -.015em; }
:root[dir="rtl"] .ledger h3 { letter-spacing: 0; }
.ledger ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 9px; }
.ledger li { color: var(--mute); position: relative; padding-inline-start: 16px; }
.ledger li::before { content: ""; position: absolute; inset-inline-start: 0; top: .72em; width: 6px; height: 6px; border-radius: 50%; background: var(--night-3); }
.big-num { font: 800 clamp(3.4rem, 9vw, 7rem)/.9 "Unbounded", sans-serif; letter-spacing: -.05em; color: var(--paper); }
.numbers { display: flex; flex-wrap: wrap; gap: clamp(24px, 6vw, 90px); margin-bottom: 56px; }
.numbers div p { color: var(--mute); margin-top: 8px; }

/* ---------- install ---------- */
.install { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); }
@media (max-width: 900px) { .install { grid-template-columns: 1fr; } }
.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: 0; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.steps li::before { content: counter(s); font: 800 1.9rem "Unbounded", sans-serif; color: var(--marigold); }
.card-dl {
  background: linear-gradient(160deg, var(--night-2), var(--night-3)); border: 1px solid var(--line);
  border-radius: 28px; padding: clamp(24px, 4vw, 40px); display: grid; gap: 20px; align-content: start;
}
.card-dl h3 { font-size: 1.5rem; }
.card-dl .btn { justify-content: center; font-size: 1.08rem; padding: 18px 26px; }
.card-dl dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; font-size: .95rem; }
.card-dl dt { color: var(--mute); }
.card-dl dd { margin: 0; }
.hash { font: 400 .74rem/1.5 ui-monospace, Menlo, Consolas, monospace; color: var(--mute); word-break: break-all; direction: ltr; text-align: start; }
.note { color: var(--mute); font-size: .95rem; }

/* ---------- footer ---------- */
footer { border-top: 1px solid var(--line); padding-block: 44px calc(44px + env(safe-area-inset-bottom, 0px)); color: var(--mute); }
footer .wrap { display: flex; flex-wrap: wrap; gap: 18px 32px; align-items: center; }
footer a { color: var(--paper); text-decoration-color: var(--line); text-underline-offset: 4px; }
footer .sp { flex: 1; }
</style>
</head>

  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len;

  ictx.moveTo(x0 + nx * w0 / 2, y0 + ny * w0 / 2); ictx.lineTo(x1 + nx * w1 / 2, y1 + ny * w1 / 2);
  ictx.lineTo(x1 - nx * w1 / 2, y1 - ny * w1 / 2); ictx.lineTo(x0 - nx * w0 / 2, y0 - ny * w0 / 2);
  ictx.closePath(); ictx.fill();

  const bez = (a, b, c, d, t) => { const m = 1 - t; return m*m*m*a + 3*m*m*t*b + 3*m*t*t*c + t*t*t*d; };
  const P = (t) => {
    const k = Math.min(2, Math.floor(t * 3)), tt = t * 3 - k, i = k * 3;
    let x = bez(C[i][0], C[i+1][0], C[i+2][0], C[i+3][0], tt);
    const y = bez(C[i][1], C[i+1][1], C[i+2][1], C[i+3][1], tt);
    if (document.documentElement.dir === "rtl") x = 1 - x;
    return [box.x + x * box.w, box.y + y * box.h];
  };
  const N = 180;
  for (let i = 0; i <= N; i++) pts.push(P(i / N));
  const width = i => (4 + (wide ? 20 : 12) * Math.sin(Math.PI * i / N) ** 1.2) * dpr;
  if (reduced) { for (let i = 1; i <= N; i++) seg(...pts[i - 1], ...pts[i], width(i - 1), width(i), "#ffc14d", 1); return; }
  let i = 1;
  const step = () => {
    for (let k = 0; k < 3 && i <= N; k++, i++) seg(...pts[i - 1], ...pts[i], width(i - 1), width(i), "#ffc14d", 1);
    if (i <= N) requestAnimationFrame(step);
  };
  setTimeout(() => requestAnimationFrame(step), 350);
}

/* ================= color math ================= */
function hsv2rgb(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return [f(5), f(3), f(1)].map(x => Math.round(x * 255));
}
const hex = ([r, g, b]) => "#" + [r, g, b].map(x => x.toString(16).padStart(2, "0")).join("");
function hex2hsv(h) {
  const n = parseInt(h.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let hh = 0;
  if (d) hh = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [(hh * 60 + 360) % 360, mx ? d / mx : 0, mx];
}

/* ================= quick menu (same layout as the app) ================= */
function drawQuickMenu(ctx, S, state, hot, opts = {}) {
  // S = size in px. Geometry in "dp" units of a 380-wide menu, like the app.
  const u = S / 380, cx = S / 2, cy = S / 2 + (opts.top ? 8 * u : 0);
  const rBase = 182 * u, rDisc = 80 * u, ring = 17 * u, rSw = 101 * u, rB = 148 * u, bR = 21 * u;
  ctx.clearRect(0, 0, S, S);
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = 30 * u; ctx.shadowOffsetY = 6 * u;
  ctx.fillStyle = "#161619"; ctx.beginPath(); ctx.arc(cx, cy, rBase, 0, 7); ctx.fill();
  ctx.restore();
  ctx.fillStyle = "#0f0f12"; ctx.beginPath(); ctx.arc(cx, cy, rSw + 18.5 * u, 0, 7); ctx.fill();
  // hue ring: red at the top
  const cg = ctx.createConicGradient ? ctx.createConicGradient(-Math.PI / 2, cx, cy) : null;
  if (cg) {
    for (let i = 0; i <= 12; i++) cg.addColorStop(i / 12, hex(hsv2rgb((i * 30) % 360, 1, 1)));
    ctx.strokeStyle = cg; ctx.lineWidth = ring;
    ctx.beginPath(); ctx.arc(cx, cy, rDisc - ring / 2, 0, 7); ctx.stroke();
  } else {
    for (let a = 0; a < 360; a += 2) {
      ctx.strokeStyle = hex(hsv2rgb(a, 1, 1)); ctx.lineWidth = ring;
      ctx.beginPath(); ctx.arc(cx, cy, rDisc - ring / 2, (a - 90) * Math.PI / 180, (a - 87) * Math.PI / 180); ctx.stroke();
    }
  }
  // saturation / brightness square
  const half = (rDisc - ring - ring * .45) / Math.SQRT2;
  const sx = cx - half, sy = cy - half, sw = half * 2;
  const g1 = ctx.createLinearGradient(sx, 0, sx + sw, 0);
  g1.addColorStop(0, "#fff"); g1.addColorStop(1, hex(hsv2rgb(state.h, 1, 1)));
  ctx.fillStyle = g1; roundRect(ctx, sx, sy, sw, sw, 6 * u); ctx.fill();
  const g2 = ctx.createLinearGradient(0, sy, 0, sy + sw);
  g2.addColorStop(0, "rgba(0,0,0,0)"); g2.addColorStop(1, "#000");
  ctx.fillStyle = g2; roundRect(ctx, sx, sy, sw, sw, 6 * u); ctx.fill();
  // handles
  const ha = (state.h - 90) * Math.PI / 180, hr = rDisc - ring / 2;
  handle(ctx, cx + Math.cos(ha) * hr, cy + Math.sin(ha) * hr, ring / 2 + 1.5 * u, hex(hsv2rgb(state.h, 1, 1)), u);
  handle(ctx, sx + state.s * sw, sy + (1 - state.v) * sw, 9 * u, hex(hsv2rgb(state.h, state.s, state.v)), u);
  // swatches + "+"
  const sws = state.swatches, n = sws.length + 1, span = Math.min(130, 13 * n);
  const geo = { cx, cy, u, sx, sy, sw, rDisc, ring, swatches: [], bubbles: [], rB };
  sws.forEach((c, i) => {
    const a = (90 + span / 2 - i * span / (n - 1)) * Math.PI / 180;
    const x = cx + Math.cos(a) * rSw, y = cy + Math.sin(a) * rSw;
    const r = (hot === "sw" + i ? 12 : 9.5) * u;
    ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    geo.swatches.push({ x, y, c, i });
  });
  { const a = (90 - span / 2) * Math.PI / 180, x = cx + Math.cos(a) * rSw, y = cy + Math.sin(a) * rSw;
    ctx.fillStyle = hot === "plus" ? "#4c8dff" : "#2a2a31"; ctx.beginPath(); ctx.arc(x, y, 9.5 * u, 0, 7); ctx.fill();
    ctx.strokeStyle = "#f2f2f5"; ctx.lineWidth = 2 * u; ctx.beginPath();
    ctx.moveTo(x - 4.5 * u, y); ctx.lineTo(x + 4.5 * u, y); ctx.moveTo(x, y - 4.5 * u); ctx.lineTo(x, y + 4.5 * u); ctx.stroke();
    geo.plus = { x, y }; }
  // size (left) + opacity (right) arcs
  arcSlider(ctx, cx, cy, rB, 158, 202, state.size, u, hot === "size");
  arcSlider(ctx, cx, cy, rB, 22, -22, state.opacity, u, hot === "opacity");
  // tool + brush bubbles
  const tools = ["i-brush", "i-smudge", "i-eraser", "i-dropper", "i-undo", "i-redo", "i-layers"];
  tools.forEach((id, i) => {
    const a = (270 + (i - 3) * 18) * Math.PI / 180, x = cx + Math.cos(a) * rB, y = cy + Math.sin(a) * rB;
    const on = i === 0, h = hot === "t" + i;
    ctx.fillStyle = h ? "#4c8dff" : on ? "#233b63" : "#2a2a31";
    ctx.beginPath(); ctx.arc(x, y, (h ? bR + 3 * u : bR), 0, 7); ctx.fill();
    if (on && !h) { ctx.strokeStyle = "#4c8dff"; ctx.lineWidth = 2 * u; ctx.stroke(); }
    if (opts.icons && opts.icons[id]) ctx.drawImage(opts.icons[on && !h ? id + "-on" : id], x - 11 * u, y - 11 * u, 22 * u, 22 * u);
    geo.bubbles.push({ x, y, id: "t" + i });
  });
  ["#2f6b8f", "#e0457b", "#1d3f5e"].forEach((c, i) => {
    const a = (90 - (i - 1) * 22) * Math.PI / 180, x = cx + Math.cos(a) * rB, y = cy + Math.sin(a) * rB;
    const h = hot === "b" + i;
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, h ? bR + 3 * u : bR, 0, 7); ctx.fillStyle = "#ededf0"; ctx.fill(); ctx.clip();
    ctx.strokeStyle = c; ctx.lineCap = "round";
    for (let k = 0; k < 3; k++) { ctx.lineWidth = (2 + k * 2.4) * u; ctx.beginPath(); ctx.moveTo(x - 16 * u, y + (6 - k * 6) * u); ctx.quadraticCurveTo(x, y - (6 + k * 2) * u, x + 16 * u, y + (4 - k * 6) * u); if (k === i) ctx.stroke(); }
    ctx.restore();
    if (h) { ctx.strokeStyle = "#4c8dff"; ctx.lineWidth = 3 * u; ctx.beginPath(); ctx.arc(x, y, bR + 3 * u, 0, 7); ctx.stroke(); }
    geo.bubbles.push({ x, y, id: "b" + i });
  });
  return geo;
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function handle(ctx, x, y, r, fill, u) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 3 * u; ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,.33)"; ctx.lineWidth = 1 * u; ctx.beginPath(); ctx.arc(x, y, r + 2 * u, 0, 7); ctx.stroke();
}
function arcSlider(ctx, cx, cy, r, a0, a1, v, u, active) {
  const rad = d => d * Math.PI / 180, ccw = a1 < a0;
  ctx.lineCap = "round"; ctx.lineWidth = 12 * u;
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.beginPath(); ctx.arc(cx, cy, r, rad(a0), rad(a1), ccw); ctx.stroke();
  const am = a0 + (a1 - a0) * v;
  if (v > .001) { ctx.strokeStyle = active ? "#4c8dff" : "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(cx, cy, r, rad(a0), rad(am), ccw); ctx.stroke(); }
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx + Math.cos(rad(am)) * r, cy + Math.sin(rad(am)) * r, (active ? 11 : 9) * u, 0, 7); ctx.fill();
  ctx.lineCap = "butt";
}

/* icons rendered once into images so the canvas can draw them */
function iconImages(ids) {
  const out = {};
  return Promise.all(ids.flatMap(id => ["#f2f2f5", "#4c8dff"].map((col, k) => new Promise(res => {
    const sym = document.getElementById(id);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${sym.getAttribute("viewBox")}" width="48" height="48" color="${col}" style="color:${col}">${sym.innerHTML.replaceAll("currentColor", col)}</svg>`;
    const img = new Image();
    img.onload = () => { out[k ? id + "-on" : id] = img; res(); };
    img.onerror = res;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  })))).then(() => out);
}

/* ---- interactive menu in the "pen" section ---- */
const qm = document.getElementById("qm"), qctx = qm.getContext("2d"), tip = document.getElementById("qmTip");
const qState = { h: 40, s: .7, v: 1, size: .35, opacity: 1,
  swatches: ["#ffc14d", "#ff6b8b", "#e0457b", "#7b5cff", "#4c8dff", "#2fb6a6", "#5fd39a", "#f6f3ff", "#6b6f8a", "#141a3a"] };
let qGeo = null, qHot = null, qDrag = null, icons = null;
const tipNames = { t0: "Brush", t1: "Smudge", t2: "Eraser", t3: "Eyedropper", t4: "Undo", t5: "Redo", t6: "Layers", b0: "Wet Round", b1: "Studio Ink", b2: "Gouache", plus: "Save color to palette" };
function sizeQm() { const r = qm.getBoundingClientRect(); const d = Math.min(devicePixelRatio || 1, 2); qm.width = qm.height = Math.round(r.width * d); drawQm(); }
function drawQm() { qGeo = drawQuickMenu(qctx, qm.width, qState, qHot, { icons }); }
function syncBrush() { brush.color = hex(hsv2rgb(qState.h, qState.s, qState.v)); brush.size = qState.size; brush.opacity = Math.max(.05, qState.opacity); brushChanged(); }
function qPoint(e) { const r = qm.getBoundingClientRect(); return [(e.clientX - r.left) * qm.width / r.width, (e.clientY - r.top) * qm.height / r.height]; }
function qHit(x, y) {
  const g = qGeo, d = Math.hypot(x - g.cx, y - g.cy), u = g.u;
  for (const b of g.bubbles) if (Math.hypot(x - b.x, y - b.y) < 26 * u) return b.id;
  for (const s of g.swatches) if (Math.hypot(x - s.x, y - s.y) < 13 * u) return "sw" + s.i;
  if (Math.hypot(x - g.plus.x, y - g.plus.y) < 13 * u) return "plus";
  if (d > g.rDisc - g.ring - 6 * u && d < g.rDisc + 10 * u) return "ring";
  if (x > g.sx - 10 * u && x < g.sx + g.sw + 10 * u && y > g.sy - 10 * u && y < g.sy + g.sw + 10 * u) return "square";
  if (d > g.rB - 22 * u && d < g.rB + 22 * u) {
    const a = Math.atan2(y - g.cy, x - g.cx) * 180 / Math.PI;
    if (a > -30 && a < 30) return "opacity";
    if (Math.abs(a) > 150) return "size";
  }
  return null;
}
function qApply(zone, x, y) {
  const g = qGeo, a = Math.atan2(y - g.cy, x - g.cx) * 180 / Math.PI;
  if (zone === "ring") qState.h = (a + 90 + 360) % 360;
  else if (zone === "square") { qState.s = Math.min(1, Math.max(0, (x - g.sx) / g.sw)); qState.v = 1 - Math.min(1, Math.max(0, (y - g.sy) / g.sw)); }
  else if (zone === "size") { const aa = a < 0 ? a + 360 : a; qState.size = Math.min(1, Math.max(0, (aa - 158) / 44)); }
  else if (zone === "opacity") qState.opacity = Math.min(1, Math.max(0, (22 - a) / 44));
  else return;
  syncBrush(); drawQm();
}
qm.addEventListener("pointerdown", e => {
  qm.setPointerCapture(e.pointerId);
  const [x, y] = qPoint(e), z = qHit(x, y);
  if (z && z.startsWith("sw")) { [qState.h, qState.s, qState.v] = hex2hsv(qState.swatches[+z.slice(2)]); syncBrush(); drawQm(); return; }
  if (z === "plus") { const c = hex(hsv2rgb(qState.h, qState.s, qState.v)); qState.swatches = [c, ...qState.swatches.filter(s => s !== c)].slice(0, 10); drawQm(); return; }
  if (z && /^[tb]\d/.test(z)) { qHot = z; drawQm(); setTimeout(() => { qHot = null; drawQm(); }, 220); return; }
  qDrag = z; qHot = z === "size" || z === "opacity" ? z : null; qApply(z, x, y);
});
qm.addEventListener("pointermove", e => {
  const [x, y] = qPoint(e);
  if (qDrag) { qApply(qDrag, x, y); return; }
  const z = qHit(x, y), hz = z && (/^[tb]\d|plus|sw/.test(z)) ? z : null;
  if (hz !== qHot) { qHot = hz; drawQm(); }
  const name = tipNames[hz];
  tip.textContent = name || ""; tip.style.opacity = name ? 1 : 0;
});
["pointerup", "pointercancel"].forEach(n => qm.addEventListener(n, () => { qDrag = null; if (qHot === "size" || qHot === "opacity") { qHot = null; drawQm(); } }));
qm.addEventListener("pointerleave", () => { if (!qDrag) { qHot = null; tip.style.opacity = 0; drawQm(); } });

/* ---- small static copy inside the tablet mockup ---- */
const mini = document.getElementById("miniMenu");
function drawMini() { drawQuickMenu(mini.getContext("2d"), mini.width, { h: 335, s: .7, v: .88, size: .3, opacity: .85, swatches: qState.swatches }, "t3", { icons }); }

/* ================= toolbar builder ================= */
const TOOLS = [
  ["select", "i-select"], ["transform", "i-transform"], ["dropper", "i-dropper"], ["fill", "i-fill"], ["text", "i-text"],
  ["adjust", "i-adjust"], ["grid", "i-grid"], ["symmetry", "i-symmetry"], ["shape", "i-shape"], ["vector", "i-vector"],
  ["blur", "i-blur"], ["focus", "i-focus"], ["share", "i-share"], ["timelapse", "i-clock"]
];
let chosen = ["select", "transform", "dropper", "fill", "text", "symmetry"];
const chipsEl = document.getElementById("chips"), dockEl = document.getElementById("dockDemo");
function renderToolbar() {
  chipsEl.innerHTML = "";
  TOOLS.forEach(([id, icon]) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.setAttribute("aria-pressed", String(chosen.includes(id)));
    b.innerHTML = `<svg aria-hidden="true"><use href="#${icon}"/></svg><span></span>`;
    b.querySelector("span").textContent = t("tool." + id);
    b.addEventListener("click", () => {
      chosen = chosen.includes(id) ? chosen.filter(x => x !== id) : [...chosen, id];
      renderToolbar();
    });
    chipsEl.appendChild(b);
  });
  dockEl.innerHTML = "";
  if (!chosen.length) { const p = document.createElement("div"); p.className = "empty"; p.textContent = t("tb.empty"); dockEl.appendChild(p); }
  chosen.forEach(id => {
    const icon = TOOLS.find(x => x[0] === id)[1];
    const s = document.createElement("div"); s.className = "slot"; s.title = t("tool." + id);
    s.innerHTML = `<svg aria-hidden="true"><use href="#${icon}"/></svg>`;
    dockEl.appendChild(s);
  });
  const c = document.createElement("div"); c.className = "count"; c.textContent = t("tb.count").replace("{n}", chosen.length);
  dockEl.appendChild(c);
}

/* ================= start ================= */
(function start() {
  let l = null;
  const q = new URLSearchParams(location.search).get("lang");
  try { l = q || localStorage.getItem("inkora-lang"); } catch (e) { l = q; }
  if (!l) {
    const n = (navigator.language || "en").toLowerCase();
    l = n.startsWith("ar") ? "ar" : (n.startsWith("ckb") || n.startsWith("ku")) ? "ckb" : "en";
  }
  setLang(l);
  syncBrush();
  sizeInk(); intro();
  sizeQm();
  drawMini();
  iconImages(["i-brush", "i-smudge", "i-eraser", "i-dropper", "i-undo", "i-redo", "i-layers"]).then(im => { icons = im; drawQm(); drawMini(); });
  let rt;
  addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { sizeInk(); sizeQm(); }, 120); });
})();
</script>
